[package]
edition      = "2024"
name         = "esp32c3-psu-indicator"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32c3-psu-indicator"
path = "./src/bin/main.rs"

[dependencies]
# Keep the unstable HAL APIs aligned with esp-rtos 0.4 and esp-radio below.
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c3", "unstable"] }

esp-rtos = { version = "0.4", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

defmt                  = "1.2"
esp-bootloader-esp-idf = { version = "0.6", features = ["defmt", "esp32c3"] }

embassy-net = { version = "0.9", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11", features = ["defmt"] }
esp-backtrace = { version = "0.20", features = [
  "defmt",
  "esp32c3",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c3"] }
embedded-hal-bus = "0.3.0"
# for more networking protocol support see https://crates.io/crates/edge-net
# Match trouble-host 0.8's controller traits.
bt-hci = "0.10"
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
# Radio 0.18 targets HAL 1.1; this release supports HAL 1.2 / RTOS 0.4.
esp-radio = { version = "=1.0.0-beta.1", features = [
  "ble",
  "coex",
  "defmt",
  "esp-alloc",
  "esp32c3",
  "unstable",
  "wifi",
] }

smoltcp = { version = "0.14", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

trouble-host = { version = "0.8", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

mcp25xx = { version = "0.4", features = ["mcp2515"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
